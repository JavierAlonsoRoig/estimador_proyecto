[project]
name = "estimador-cag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Javier Alonso", email = "javier@kpianalisis.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=1.5.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "litellm>=1.83.0",
    "openai>=1.0.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy[asyncio]>=2.1.6",
    "streamlit>=1.64.0",
    "structlog>=26.1.0",
    "tiktoken>=0.7.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
estimador-cag = "estimador_cag:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
